name: FOODROUTE quality gates
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  source-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/phase7-audit.cjs
      - run: node --test tests/phase7-release.test.cjs

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      # Frontend is an npm workspace: the lockfile is at repo root.
      - run: npm ci
      - run: npm run test:ci --workspace apps/web

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/functions/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:release

  routing-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      # Root workspace provides the TypeScript compiler used by routing-engine.
      - run: npm ci
      - run: npm test --workspace packages/routing-engine

  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Emulator rules regression
        run: npx --yes firebase-tools@14 emulators:exec --config firebase.phase7.example.json --only firestore --project demo-foodroute-phase3 "npm --prefix apps/web run test:rules"
