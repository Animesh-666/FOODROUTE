name: FOODROUTE quality gates
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/phase7-audit.cjs
      - run: node --test tests/phase7-release.test.cjs
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run test:ci
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/functions/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:release
  routing-engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/routing-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/routing-engine/package-lock.json
      - run: npm ci
      - run: npm test
  firestore-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
        working-directory: apps/web
      - name: Emulator rules regression
        run: npx --yes firebase-tools@14 emulators:exec --config firebase.phase7.example.json --only firestore --project demo-foodroute-phase3 "npm --prefix apps/web run test:rules"
